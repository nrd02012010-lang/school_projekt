<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выборы Президента Школы</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Выборы Президента Школы</h1>

        <!-- ШАГ 1: Ввод данных -->
        <div id="step-1" class="step-card">
            <h2>1. Регистрация</h2>
            <input type="text" id="firstName" placeholder="Имя" required>
            <input type="text" id="lastName" placeholder="Фамилия" required>
            <input type="text" id="grade" placeholder="Класс (например, 10-А)" required>
            <input type="tel" id="phone" placeholder="Номер телефона (87XXXXXXXXX)" required>
            <button id="btn-request-code">Получить код в Telegram</button>
        </div>

        <!-- ШАГ 2: Подтверждение кода -->
        <div id="step-2" class="step-card hidden">
            <h2>2. Подтверждение через Telegram</h2>
            <p>Нажмите на кнопку ниже, запустите бота и скопируйте код:</p>
            <a id="bot-link" href="#" target="_blank" class="bot-btn">Открыть Telegram-бота 🚀</a>
            <input type="text" id="telegramCode" placeholder="Введите 4-значный код" maxlength="4">
            <button id="btn-verify-code">Подтвердить код</button>
        </div>

        <!-- ШАГ 3: Голосование -->
        <div id="step-3" class="step-card hidden">
            <h2>3. Выберите кандидата</h2>
            <div id="candidates-list"></div>
            <button id="btn-vote">Проголосовать</button>
        </div>

        <div id="message" class="message hidden"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
