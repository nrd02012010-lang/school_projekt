<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выборы Президента Школы</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Выборы Президента Школы</h1>

        <!-- ЭКРАН 1: Авторизация по номеру и TG -->
        <div id="auth-screen" class="card">
            <h2>Авторизация</h2>
            <div class="form-group">
                <input type="tel" id="phone" placeholder="Номер телефона (87XXXXXXXXX)">
                <button id="btn-get-code">Получить код</button>
            </div>

            <div id="telegram-block" class="form-group hidden">
                <a id="bot-link" href="#" target="_blank" class="tg-btn">Перейти в ТГ бота</a>
                <input type="text" id="telegramCode" placeholder="Код из бота" maxlength="4">
                <button id="btn-verify-code">Проверить</button>
            </div>
        </div>

        <!-- ЭКРАН 2: Анкетные данные + Голосование -->
        <div id="vote-screen" class="card hidden">
            <h2>Заполнение данных и выбор</h2>
            <input type="text" id="firstName" placeholder="Имя">
            <input type="text" id="lastName" placeholder="Фамилия">
            <input type="text" id="grade" placeholder="Класс (например, 10-А)">
            
            <h3>Выберите кандидата:</h3>
            <div id="candidates-list"></div>

            <button id="btn-vote" class="vote-btn">Проголосовать</button>
        </div>

        <div id="message" class="message hidden"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
