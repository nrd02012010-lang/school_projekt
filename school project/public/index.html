<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выборы Президента Школы</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Базовый сброс под единообразный темный стиль полей */
        input[type="text"],
        input[type="tel"],
        input[type="password"],
        textarea {
            width: 100%;
            background: #222 !important;
            border: 1px solid #444 !important;
            border-radius: 5px;
            color: #fff !important;
            padding: 12px !important;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            margin-bottom: 12px;
        }

        input::placeholder, textarea::placeholder {
            color: #777 !important;
        }

        input[type="file"] {
            width: 100%;
            background: #222 !important;
            border: 1px solid #444 !important;
            border-radius: 5px;
            color: #fff !important;
            padding: 8px !important;
            box-sizing: border-box;
            margin-bottom: 12px;
        }

        /* Кнопка Шестеренка */
        .admin-gear {
            position: fixed;
            top: 15px;
            right: 15px;
            font-size: 24px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #444;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            transition: 0.2s;
            z-index: 1000;
        }
        .admin-gear:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: rotate(45deg);
        }

        /* Контейнер для ленты кандидатов */
        .candidates-feed {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 15px;
            margin-bottom: 20px;
        }

        /* Карточка кандидата */
        .candidate-card {
            border: 2px solid #333;
            border-radius: 16px;
            padding: 16px;
            background: #181818;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.25s ease, transform 0.2s ease, box-shadow 0.25s ease;
            box-sizing: border-box;
            width: 100%;
        }

        .candidate-card:hover {
            border-color: #555;
        }

        /* Выбранная карточка */
        .candidate-card.selected {
            border-color: #00d2ff;
            background: #1e262e;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.2);
        }

        /* Фото кандидата */
        .candidate-card img {
            width: 100%;
            max-height: 320px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 12px;
            background-color: #222;
        }

        /* ФИО кандидата */
        .candidate-card h3 {
            margin: 0 0 6px 0;
            font-size: 20px;
            color: #fff;
            font-weight: 600;
        }

        /* Класс кандидата */
        .candidate-card .grade-badge {
            color: #00d2ff;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 10px;
            background: rgba(0, 210, 255, 0.1);
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
        }

        /* Описание / программа кандидата */
        .candidate-card p {
            font-size: 14px;
            color: #bbb;
            margin: 0;
            line-height: 1.5;
            white-space: pre-line;
        }

        /* Таблица админки */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; text-align: left; }
        th, td { padding: 8px; border-bottom: 1px solid #444; font-size: 14px; }
        th { color: #888; }

        .admin-form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <!-- Иконка шестеренки -->
    <div id="btn-gear" class="admin-gear" title="Панель администратора">⚙️</div>

    <div class="container">
        <h1>ВЫБОРЫ ПРЕЗИДЕНТА ШКОЛЫ</h1>

        <div id="message" class="message hidden"></div>

        <!-- 1. АВТОРИЗАЦИЯ УЧЕНИКА -->
        <div id="auth-section" class="card">
            <h2>АВТОРИЗАЦИЯ</h2>
            <input type="tel" id="phone" placeholder="+7 (700) 000-00-00">
            <button id="btn-get-code" class="btn">Получить код</button>
            
            <a id="btn-bot-link" href="#" target="_blank" class="btn btn-telegram hidden" style="display:block; text-align:center; text-decoration:none; margin: 10px 0;">Открыть Telegram-бота</a>

            <input type="text" id="code" placeholder="Код из бота">
            <button id="btn-verify" class="btn">Проверить</button>
        </div>

        <!-- 2. ГОЛОСОВАНИЕ -->
        <div id="vote-section" class="card hidden">
            <h2>АНКЕТА И ГОЛОСОВАНИЕ</h2>
            <input type="text" id="fullName" placeholder="Ваше ФИО (например, Иванов Иван)">
            <input type="text" id="grade" placeholder="Ваш класс (например, 10-А)">
            
            <h3 style="margin-top:20px; text-align: center;">Выберите кандидата:</h3>
            
            <!-- Лента карточек кандидатов -->
            <div id="candidates-list" class="candidates-feed"></div>

            <button id="btn-submit-vote" class="btn">Отправить голос</button>
        </div>

        <!-- 3. Окно входа в админку -->
        <div id="admin-login-section" class="card hidden">
            <h2>ВХОД ДЛЯ АДМИНА ⚙️</h2>
            <input type="tel" id="admin-phone" placeholder="Ваш номер телефона">
            <input type="password" id="admin-password" placeholder="Пароль администратора">
            <button id="btn-admin-login" class="btn">Войти</button>
            <button id="btn-admin-close" class="btn" style="background:#555; margin-top:5px;">Отмена</button>
        </div>

        <!-- 4. ПАНЕЛЬ АДМИНА -->
        <div id="admin-panel-section" class="card hidden">
            <h2>ДОБАВИТЬ КАНДИДАТА</h2>
            <div class="admin-form-group">
                <input type="text" id="new-candidate-name" placeholder="ФИО кандидата">
                <input type="text" id="new-candidate-grade" placeholder="Класс (например, 11-Б)">
                
                <label style="font-size:13px; color:#aaa; text-align:left; margin-bottom: 5px;">Загрузить фото кандидата:</label>
                <input type="file" id="new-candidate-photo" accept="image/*">
                
                <textarea id="new-candidate-description" placeholder="Предвыборная программа / описание" rows="3" style="resize:vertical;"></textarea>
                <button id="btn-add-candidate" class="btn" style="margin-top: 5px;">Добавить кандидата</button>
            </div>

            <h3 style="text-align: left; margin-top: 15px;">Текущие кандидаты:</h3>
            <div id="admin-candidates-list" style="margin-bottom: 20px;"></div>

            <hr style="border-color: #444; margin: 20px 0;">

            <h2>РЕЗУЛЬТАТЫ ГОЛОСОВАНИЯ</h2>
            <button id="btn-admin-refresh" class="btn" style="margin-bottom: 15px;">Обновить данные</button>
            
            <div id="results-stats"></div>

            <h3 style="margin-top: 20px; text-align: left;">Проголосовавшие ученики:</h3>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>ФИО</th>
                            <th>Класс</th>
                            <th>Телефон</th>
                            <th>Кандидат</th>
                        </tr>
                    </thead>
                    <tbody id="votes-table-body"></tbody>
                </table>
            </div>
            <button id="btn-admin-exit" class="btn" style="background:#555; margin-top:15px;">Выйти</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
