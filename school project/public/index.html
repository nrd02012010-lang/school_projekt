<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выборы Президента Школы</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Кнопка Шестеренка */
        .admin-gear {
            position: fixed;
            top: 15px;
            right: 15px;
            font-size: 24px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #444;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            transition: 0.2s;
        }
        .admin-gear:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: rotate(45deg);
        }
        /* Стили таблицы админки */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; text-align: left; }
        th, td { padding: 8px; border-bottom: 1px solid #444; font-size: 14px; }
        th { color: #888; }

        .admin-form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }
        .admin-form-group input, .admin-form-group textarea {
            width: 100%;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <!-- Иконка шестеренки -->
    <div id="btn-gear" class="admin-gear" title="Панель администратора">⚙️</div>

    <div class="container">
        <h1>ВЫБОРЫ ПРЕЗИДЕНТА ШКОЛЫ</h1>

        <div id="message" class="message hidden"></div>

        <!-- 1. АВТОРИЗАЦИЯ УЧЕНИКА -->
        <div id="auth-section" class="card">
            <h2>АВТОРИЗАЦИЯ</h2>
            <input type="tel" id="phone" placeholder="+7 (700) 000-00-00">
            <button id="btn-get-code" class="btn">Получить код</button>
            
            <a id="btn-bot-link" href="#" target="_blank" class="btn btn-telegram hidden" style="display:block; text-align:center; text-decoration:none; margin: 10px 0;">Открыть Telegram-бота</a>

            <input type="text" id="code" placeholder="Код из бота">
            <button id="btn-verify" class="btn">Проверить</button>
        </div>

        <!-- 2. ГОЛОСОВАНИЕ -->
        <div id="vote-section" class="card hidden">
            <h2>АНКЕТА И ГОЛОСОВАНИЕ</h2>
            <input type="text" id="fullName" placeholder="ФИО (например, Иванов Иван)">
            <input type="text" id="grade" placeholder="Класс (например, 10-А)">
            
            <h3>Выберите кандидата:</h3>
            <div id="candidates-list"></div>

            <button id="btn-submit-vote" class="btn">Отправить голос</button>
        </div>

        <!-- 3. Окно входа в админку (Телефон + Пароль) -->
        <div id="admin-login-section" class="card hidden">
            <h2>ВХОД ДЛЯ АДМИНА ⚙️</h2>
            <input type="tel" id="admin-phone" placeholder="Ваш номер телефона">
            <input type="password" id="admin-password" placeholder="Пароль администратора">
            <button id="btn-admin-login" class="btn">Войти</button>
            <button id="btn-admin-close" class="btn" style="background:#555; margin-top:5px;">Отмена</button>
        </div>

        <!-- 4. ПАНЕЛЬ АДМИНА (Результаты и Кандидаты) -->
        <div id="admin-panel-section" class="card hidden">
            <h2>ДОБАВИТЬ КАНДИДАТА</h2>
            <div class="admin-form-group">
                <input type="text" id="new-candidate-name" placeholder="ФИО кандидата">
                <input type="text" id="new-candidate-grade" placeholder="Класс (например, 11-Б)">
                <input type="text" id="new-candidate-photo" placeholder="Ссылка на фото (URL)">
                <textarea id="new-candidate-description" placeholder="Предвыборная программа / описание" rows="3" style="resize:vertical; padding: 10px; background:#222; color:#fff; border:1px solid #444; border-radius:5px;"></textarea>
                <button id="btn-add-candidate" class="btn" style="margin-top: 5px;">Добавить кандидата</button>
            </div>

            <h3>Текущие кандидаты:</h3>
            <div id="admin-candidates-list" style="margin-bottom: 20px;"></div>

            <hr style="border-color: #444; margin: 20px 0;">

            <h2>РЕЗУЛЬТАТЫ ГОЛОСОВАНИЯ</h2>
            <button id="btn-admin-refresh" class="btn" style="margin-bottom: 15px;">Обновить данные</button>
            
            <div id="results-stats"></div>

            <h3 style="margin-top: 20px;">Проголосовавшие ученики:</h3>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>ФИО</th>
                            <th>Класс</th>
                            <th>Телефон</th>
                            <th>Кандидат</th>
                        </tr>
                    </thead>
                    <tbody id="votes-table-body"></tbody>
                </table>
            </div>
            <button id="btn-admin-exit" class="btn" style="background:#555; margin-top:15px;">Выйти</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
