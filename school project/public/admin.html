<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админка — Голосование</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 20px auto; padding: 0 10px; background-color: #121212; color: #fff; }
        .card { border: 1px solid #333; background: #1e1e1e; padding: 15px; margin-bottom: 20px; border-radius: 8px; }
        input, select, button { padding: 10px; margin: 5px 0; box-sizing: border-box; background: #2b2b2b; color: #fff; border: 1px solid #444; border-radius: 4px; }
        input { width: 100%; }
        button { background: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; width: 100%; }
        button:hover { background: #0056b3; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #333; padding: 8px; text-align: left; }
        th { background-color: #2a2a2a; }
        .results-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-top: 10px; }
        .candidate-card { background: #252525; border: 2px solid #007bff; border-radius: 8px; padding: 15px; text-align: center; }
        .candidate-card h4 { margin: 0 0 5px 0; color: #fff; }
        .candidate-card .votes { font-size: 24px; font-weight: bold; color: #00ff66; }
        .candidate-select { background: #222; color: #00ff66; border: 1px solid #444; padding: 5px; border-radius: 4px; width: 100%; }
        .badge-read-only { background: #ff9800; color: #000; padding: 5px 10px; border-radius: 4px; font-weight: bold; display: inline-block; margin-bottom: 10px; }
    </style>
</head>
<body>
    <h2>Панель Администратора</h2>

    <!-- Блок Авторизации -->
    <div class="card" id="login-card">
        <h3>Вход</h3>
        <input type="text" id="adminLogin" placeholder="Логин (например, admin или zavuch)">
        <input type="password" id="adminPassword" placeholder="Пароль доступа">
        <button onclick="loadAdminData()">Войти</button>
    </div>

    <!-- Основной Контент -->
    <div id="admin-content" style="display: none;">
        
        <!-- Уведомление для завуча -->
        <div id="read-only-badge" class="badge-read-only" style="display: none;">
            👁️ Режим наблюдения (только чтение)
        </div>

        <!-- Результаты -->
        <div class="card">
            <h3>📊 Результаты голосов</h3>
            <div id="results-list" class="results-grid"></div>
        </div>

        <!-- Добавление кандидата (скрыто для завуча) -->
        <div class="card admin-only-control">
            <h3>➕ Добавить кандидата</h3>
            <input type="text" id="candName" placeholder="ФИО Кандидата">
            <input type="text" id="candClass" placeholder="Класс (например, 11A)">
            <button onclick="addCandidate()">Добавить кандидата</button>
        </div>

        <!-- Таблица проголосовавших -->
        <div class="card">
            <h3>👥 Список проголосовавших</h3>
            <table>
                <thead>
                    <tr>
                        <th>ФИО</th>
                        <th>Класс</th>
                        <th>Телефон</th>
                        <th>Выбор кандидата</th>
                    </tr>
                </thead>
                <tbody id="voters-table"></tbody>
            </table>
        </div>
    </div>

    <script>
        let currentLogin = '';
        let currentPassword = '';

        async function loadAdminData() {
            currentLogin = document.getElementById('adminLogin').value.trim();
            currentPassword = document.getElementById('adminPassword').value.trim();

            if (!currentLogin || !currentPassword) {
                alert('Введите логин и пароль!');
                return;
            }

            try {
                const res = await fetch('/api/admin/stats', {
                    headers: {
                        'x-admin-login': currentLogin,
                        'x-admin-password': currentPassword
                    }
                });

                if (res.status === 403) {
                    alert('Неверный логин или пароль!');
                    return;
                }

                const data = await res.json();

                document.getElementById('login-card').style.display = 'none';
                document.getElementById('admin-content').style.display = 'block';

                // Управление правами редактирования (для завуча скрываем кнопки)
                const adminControls = document.querySelectorAll('.admin-only-control');
                adminControls.forEach(el => {
                    el.style.display = data.canEdit ? 'block' : 'none';
                });

                document.getElementById('read-only-badge').style.display = data.canEdit ? 'none' : 'block';

                // 1. Отрисовка кандидатов
                const resultsList = document.getElementById('results-list');
                resultsList.innerHTML = '';
                if (!data.stats || data.stats.length === 0) {
                    resultsList.innerHTML = '<p>Кандидаты еще не добавлены.</p>';
                } else {
                    data.stats.forEach(c => {
                        resultsList.innerHTML += `
                            <div class="candidate-card">
                                <h4>${c.name}</h4>
                                <div class="votes">${c.votes} голосов</div>
                            </div>
                        `;
                    });
                }

                // 2. Отрисовка таблицы проголосовавших
                const tbody = document.getElementById('voters-table');
                tbody.innerHTML = '';
                if (!data.voters || data.voters.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">Пока никто не проголосовал.</td></tr>';
                } else {
                    data.voters.forEach(v => {
                        let candidateCell = '';

                        if (!data.canEdit) {
                            // Режим завуча: просто зеленый текст
                            candidateCell = `<b style="color: #00ff66;">${v.candidateName}</b>`;
                        } else {
                            // Режим админа: выпадающий список для смены голоса
                            let optionsHtml = '';
                            data.stats.forEach(cand => {
                                const isSelected = cand.name === v.candidateName ? 'selected' : '';
                                optionsHtml += `<option value="${cand.id}" ${isSelected}>${cand.name}</option>`;
                            });
                            candidateCell = `
                                <select class="candidate-select" onchange="changeVoterCandidate(${v.id}, this.value)">
                                    ${optionsHtml}
                                </select>
                            `;
                        }

                        tbody.innerHTML += `
                            <tr>
                                <td>${v.fullName}</td>
                                <td>${v.grade}</td>
                                <td>${v.phone}</td>
                                <td>${candidateCell}</td>
                            </tr>
                        `;
                    });
                }

            } catch (err) {
                alert('Ошибка загрузки данных: ' + err.message);
            }
        }

        // Добавление кандидата (только для полного админа)
        async function addCandidate() {
            const name = document.getElementById('candName').value.trim();
            const grade = document.getElementById('candClass').value.trim();

            if (!name) return alert('Введите имя кандидата!');

            const res = await fetch('/api/admin/add-candidate', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'x-admin-password': currentPassword
                },
                body: JSON.stringify({ name, grade })
            });

            if (res.ok) {
                alert('Кандидат добавлен!');
                document.getElementById('candName').value = '';
                document.getElementById('candClass').value = '';
                loadAdminData();
            } else {
                alert('Ошибка при добавлении');
            }
        }

        // Смена выбора кандидата у ученика (только для полного админа)
        async function changeVoterCandidate(voterId, newCandidateId) {
            try {
                const res = await fetch('/api/admin/change-voter-candidate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-admin-password': currentPassword
                    },
                    body: JSON.stringify({ voterId, newCandidateId })
                });

                const result = await res.json();
                if (!res.ok) throw new Error(result.error || 'Ошибка смены голоса');

                loadAdminData(); // Обновляем данные
            } catch (err) {
                alert('Не удалось изменить голос: ' + err.message);
                loadAdminData();
            }
        }
    </script>
</body>
</html>
