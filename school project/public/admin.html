<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель Администратора</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" style="max-width: 800px;">
        <h1>Админ-панель</h1>

        <!-- Форма входа -->
        <div id="login-card" class="card">
            <h2>Доступ ограничен</h2>
            <div class="form-group">
                <input type="password" id="adminPassword" placeholder="Введите ваш личный код">
                <button id="btn-login">Войти в панель</button>
            </div>
        </div>

        <!-- Панель управления -->
        <div id="admin-panel" class="card hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                <h2>Результаты голосования</h2>
                <button id="btn-refresh" style="padding: 8px 16px; font-size: 14px;">Обновить данные</button>
            </div>

            <h3 style="margin-top: 20px;">Подсчет голосов</h3>
            <div id="results-stats"></div>

            <h3 style="margin-top: 30px;">Детальный список проголосовавших</h3>
            <div style="overflow-x: auto;">
                <table style="width: 100%; border-collapse: collapse; margin-top: 10px; color: #fff;">
                    <thead>
                        <tr style="border-bottom: 2px solid #00ff66; text-align: left;">
                            <th style="padding: 10px;">ФИО</th>
                            <th style="padding: 10px;">Класс</th>
                            <th style="padding: 10px;">Телефон</th>
                            <th style="padding: 10px;">Кандидат</th>
                        </tr>
                    </thead>
                    <tbody id="votes-table-body"></tbody>
                </table>
            </div>
        </div>

        <div id="message" class="message hidden"></div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
